services:
  app:
    build:
      context: .
      target: runtime
    image: agentic-contact-center:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8026:8026"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8026"
      RTC_ASR_BASE_URL: http://rtc-asr:8080
      # Keep browser audio on the presentation origin; ACC tunnels this path
      # to the rtc-asr service inside the Compose network.
      RTC_ASR_WS_URL: ${RTC_ASR_BROWSER_WS_URL:-/api/cluecon/asr/stream}
      RTC_ASR_MODEL: ${RTC_ASR_MODEL:-mlx-community/parakeet-tdt_ctc-110m}
      ACC_TTS_PROVIDER: ${ACC_TTS_PROVIDER:-}
      POCKET_TTS_BASE_URL: ${POCKET_TTS_CONTAINER_BASE_URL:-}
      POCKET_TTS_VOICE: ${POCKET_TTS_VOICE:-alloy}
      POCKET_TTS_MODEL: ${POCKET_TTS_MODEL:-pocket-tts}
      POCKET_TTS_HEALTH_PATH: ${POCKET_TTS_HEALTH_PATH:-/health}
      POCKET_TTS_SPEECH_PATH: ${POCKET_TTS_SPEECH_PATH:-/v1/audio/speech}
      KOKORO_BASE_URL: http://kokoro:8880
      BROWSER_WEBRTC_BRIDGE_URL: http://browser-webrtc-bridge:8766
      ACC_OPENAI_CONVERSATION_MODEL: ${ACC_OPENAI_CONVERSATION_MODEL:-gpt-5.4-mini}
      ACC_OPENAI_AUTH_MODE: ${ACC_OPENAI_AUTH_MODE:-codex_oauth}
      ACC_CODEX_VOICE_BRIDGE_URL: http://codex-voice-bridge:8771
      ACC_OPENAI_AUTH_TOKEN: ${ACC_OPENAI_AUTH_TOKEN:-}
      ACC_OPENCLAW_AGENT_ID: ${ACC_OPENCLAW_AGENT_ID:-acc-voice}
      ACC_OPENAI_BASE_URL: ${ACC_OPENAI_BASE_URL:-https://api.openai.com/v1}
      ACC_OPENAI_API_KEY: ${ACC_OPENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test:
        - CMD
        - node
        - scripts/health-smoke.mjs
        - --url
        - http://127.0.0.1:8026/health
        - --timeout-ms
        - "8000"
        - --interval-ms
        - "250"
        - --expect-pipecat-ready
        - "true"
        - --expect-pipecat-prototype-mode
        - pipecat_local_runtime
        - --expect-pipecat-transport
        - local_process
        - --expect-pipecat-runtime-engine
        - pipecat-ai
        - --expect-pipecat-credentials-mode
        - mocked
        - --expect-pipecat-runtime-check-command
        - npm run pipecat:check
        - --expect-pipecat-runtime-check-live-telephony-required
        - "false"
        - --expect-production-ready
        - "false"
        - --expect-production-readiness-blocker
        - live_telephony_not_enabled
        - --expect-production-readiness-blocker
        - provider_credentials_mocked
        - --expect-production-readiness-blocker
        - state_store_in_memory
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 5s

  proof:
    build:
      context: .
      target: runtime
    image: agentic-contact-center:local
    profiles: ["proof"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command:
      - node
      - scripts/demo-proof.mjs
      - --out
      - artifacts/demo-proof-docker.json
      - --latest-out
      - artifacts/demo-proof-latest.json
    volumes:
      - ./artifacts:/app/artifacts


  freeswitch:
    image: safarov/freeswitch:latest
    platform: linux/amd64
    profiles: ["freeswitch", "sip", "sip-verto", "full"]
    depends_on:
      - app
    ports:
      # Stable host-only Linphone ingress. The acc-local profile binds the
      # container's bridge address on 5060 while the vanilla internal profile
      # remains isolated on container loopback at the same port.
      - "127.0.0.1:5060:5060/udp"
      - "127.0.0.1:5060:5060/tcp"
      - "127.0.0.1:8021:8021/tcp"
      - "127.0.0.1:8081:8081/tcp"
      - "127.0.0.1:8082:8082/tcp"
      - "127.0.0.1:16384-16484:16384-16484/udp"
    volumes:
      - ./freeswitch/conf/dialplan/default/acc_local_sip.xml:/etc/freeswitch/dialplan/default/acc_local_sip.xml:ro
      - ./freeswitch/conf/directory/default/1000.xml:/etc/freeswitch/directory/default/1000.xml:ro
      - ./freeswitch/conf/directory/default/acc-pipecat.xml:/etc/freeswitch/directory/default/acc-pipecat.xml:ro
      - ./freeswitch/conf/directory/localhost.xml:/etc/freeswitch/directory/localhost.xml:ro
      - ./freeswitch/conf/sip_profiles/acc-local.xml:/etc/freeswitch/sip_profiles/acc-local.xml:ro
      - ./freeswitch/conf/autoload_configs/switch.conf.xml:/etc/freeswitch/autoload_configs/switch.conf.xml:ro
      - ./freeswitch/conf/autoload_configs/event_socket.conf.xml:/etc/freeswitch/autoload_configs/event_socket.conf.xml:ro
      - ./freeswitch/conf/autoload_configs/verto.conf.xml:/etc/freeswitch/autoload_configs/verto.conf.xml:ro
      - ./freeswitch/conf/sip_profiles/internal.xml:/etc/freeswitch/sip_profiles/internal.xml:ro
      - ./artifacts/freeswitch-live:/var/log/freeswitch/acc
    environment:
      ACC_BASE_URL: http://app:8026

  rtc-asr:
    image: ${RTC_ASR_IMAGE:-rtc-asr:local}
    profiles: ["voice", "browser-webrtc", "sip", "sip-verto", "full"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASR_BACKEND: ${ASR_BACKEND:-parakeet-nemo}
      ASR_PARAKEET_MODEL: ${ASR_PARAKEET_MODEL:-nvidia/parakeet-tdt_ctc-110m}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_PRELOAD_MODEL: ${ASR_PRELOAD_MODEL:-true}
      ASR_VAD_FILTER: ${ASR_VAD_FILTER:-false}
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import json, urllib.request; payload = json.load(urllib.request.urlopen("http://127.0.0.1:8080/ready", timeout=2)); raise SystemExit(0 if payload.get("ready") is True and payload.get("model_loaded") is True else 1)'
      interval: 10s
      timeout: 3s
      retries: 12
      # A first Parakeet download can take several minutes on conference Wi-Fi.
      # Once started, steady-state readiness is still checked every 10 seconds.
      start_period: 10m

  kokoro:
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:latest}
    profiles: ["voice", "browser-webrtc", "sip", "sip-verto", "full"]
    ports:
      - "127.0.0.1:8880:8880"
    environment:
      KOKORO_MODEL: ${KOKORO_MODEL:-kokoro}
      KOKORO_VOICE: ${KOKORO_VOICE:-af_heart}
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8880/health", timeout=2).read()'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  browser-webrtc-bridge:
    build:
      context: .
      target: voice-runtime
    image: agentic-contact-center:voice-local
    profiles: ["browser-webrtc", "full"]
    depends_on:
      - app
      - rtc-asr
      - kokoro
    command:
      - python3
      - scripts/pipecat-browser-webrtc-bridge.py
      - --host
      - 0.0.0.0
      - --port
      - "8766"
      - --acc-url
      - http://app:8026
    ports:
      - "127.0.0.1:8766:8766"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ACC_URL: http://app:8026
      ACC_HEALTH_PATH: /api/pipecat-media-engine/readiness
      RTC_ASR_BASE_URL: http://rtc-asr:8080
      RTC_ASR_HEALTH_PATH: /ready
      RTC_ASR_WS_URL: ws://rtc-asr:8080/v1/stt/stream
      ACC_VOICE_READINESS_TIMEOUT_SEC: "3"
      RTC_ASR_MODEL: ${RTC_ASR_MODEL:-mlx-community/parakeet-tdt_ctc-110m}
      ACC_TTS_PROVIDER: ${ACC_TTS_PROVIDER:-}
      POCKET_TTS_BASE_URL: ${POCKET_TTS_CONTAINER_BASE_URL:-}
      POCKET_TTS_VOICE: ${POCKET_TTS_VOICE:-alloy}
      POCKET_TTS_MODEL: ${POCKET_TTS_MODEL:-pocket-tts}
      POCKET_TTS_HEALTH_PATH: ${POCKET_TTS_HEALTH_PATH:-/health}
      POCKET_TTS_SPEECH_PATH: ${POCKET_TTS_SPEECH_PATH:-/v1/audio/speech}
      KOKORO_BASE_URL: http://kokoro:8880
      KOKORO_VOICE: ${KOKORO_VOICE:-af_heart}
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c 'import json, urllib.request; payload = json.load(urllib.request.urlopen("http://127.0.0.1:8766/health", timeout=2)); raise SystemExit(0 if payload.get("ok") else 1)'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  freeswitch-bridge:
    build:
      context: .
      target: runtime
    image: agentic-contact-center:local
    profiles: ["sip", "full"]
    depends_on:
      - app
      - freeswitch
      - rtc-asr
      - kokoro
    command:
      - node
      - scripts/freeswitch-acc-bridge.mjs
      - --recording-dir
      - artifacts/freeswitch-live/media
      - --freeswitch-recording-dir
      - /var/log/freeswitch/acc/media
      - --log
      - artifacts/freeswitch-live/freeswitch-esl-events.json
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      ACC_BASE_URL: http://app:8026
      RTC_ASR_WS_URL: ws://rtc-asr:8080/v1/stt/stream
      KOKORO_BASE_URL: http://kokoro:8880
      KOKORO_VOICE: ${KOKORO_VOICE:-af_heart}
      ACC_VERTO_OWNS_GREETING: ${ACC_VERTO_OWNS_GREETING:-false}
      ACC_VERTO_OWNS_MEDIA: ${ACC_VERTO_OWNS_MEDIA:-false}

  pipecat-verto-bridge:
    # The regex runtime intentionally refuses imports from the process CWD.
    # Run outside /app while keeping all application paths explicit.
    working_dir: /tmp
    build:
      context: .
      target: voice-runtime
    image: agentic-contact-center:voice-local
    profiles: ["sip-verto", "full"]
    depends_on:
      - app
      - codex-voice-bridge
      - freeswitch
      - rtc-asr
      - kokoro
    command:
      - python3
      - /app/scripts/pipecat-verto-agent-bridge.py
      - --host
      - 0.0.0.0
      - --port
      - "8770"
      - --verto-url
      - ws://freeswitch:8081
      - --login
      - acc-pipecat@127.0.0.1
      - --password
      - local-verto-pass
    ports:
      - "127.0.0.1:8770:8770"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      ACC_URL: http://app:8026
      ACC_HEALTH_PATH: /api/pipecat-media-engine/readiness
      RTC_ASR_BASE_URL: http://rtc-asr:8080
      RTC_ASR_HEALTH_PATH: /ready
      RTC_ASR_WS_URL: ws://rtc-asr:8080/v1/stt/stream
      ACC_VOICE_READINESS_TIMEOUT_SEC: "3"
      ACC_TTS_PROVIDER: ${ACC_TTS_PROVIDER:-}
      POCKET_TTS_BASE_URL: ${POCKET_TTS_CONTAINER_BASE_URL:-}
      POCKET_TTS_VOICE: ${POCKET_TTS_VOICE:-alloy}
      POCKET_TTS_MODEL: ${POCKET_TTS_MODEL:-pocket-tts}
      POCKET_TTS_HEALTH_PATH: ${POCKET_TTS_HEALTH_PATH:-/health}
      POCKET_TTS_SPEECH_PATH: ${POCKET_TTS_SPEECH_PATH:-/v1/audio/speech}
      KOKORO_BASE_URL: http://kokoro:8880
      ACC_TTS_CACHE_DIR: ${ACC_TTS_CACHE_DIR:-/app/artifacts/tts-cache}
      FREESWITCH_VERTO_URL: ws://freeswitch:8081
      FREESWITCH_VERTO_LOGIN: acc-pipecat@127.0.0.1
      FREESWITCH_VERTO_PASSWORD: local-verto-pass
      ACC_VERTO_OWNS_GREETING: ${ACC_VERTO_OWNS_GREETING:-true}
      ACC_SIP_GREETING_PREROLL_MS: ${ACC_SIP_GREETING_PREROLL_MS:-300}
      # G.711 softphone speech arrives quieter than browser microphone PCM.
      # The measured idle floor is near zero, so 120 retains useful margin.
      ACC_WEBRTC_SILENCE_RMS: ${ACC_WEBRTC_SILENCE_RMS:-120}
      ACC_WEBRTC_SILENCE_MS: ${ACC_WEBRTC_SILENCE_MS:-600}
      ACC_WEBRTC_MIN_TURN_MS: ${ACC_WEBRTC_MIN_TURN_MS:-300}
      ACC_WEBRTC_MAX_TURN_MS: ${ACC_WEBRTC_MAX_TURN_MS:-5000}
      ACC_TTS_OUTPUT_CHUNK_YIELD_MS: ${ACC_TTS_OUTPUT_CHUNK_YIELD_MS:-20}
      ACC_TTS_EVIDENCE_EVERY_N_CHUNKS: ${ACC_TTS_EVIDENCE_EVERY_N_CHUNKS:-50}
      ACC_TTS_REQUEST_TIMEOUT_SEC: ${ACC_TTS_REQUEST_TIMEOUT_SEC:-60}
      ACC_VERTO_AUDIO_OUT_SAMPLE_RATE: ${ACC_VERTO_AUDIO_OUT_SAMPLE_RATE:-8000}
      PIPECAT_VERTO_PROOF_OUT: /app/artifacts/freeswitch-live/pipecat-verto-proof.json
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c 'import json, urllib.request; payload = json.load(urllib.request.urlopen("http://127.0.0.1:8770/health", timeout=2)); raise SystemExit(0 if payload.get("ok") else 1)'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  codex-voice-bridge:
    build:
      context: .
      target: voice-runtime
    image: agentic-contact-center:voice-local
    profiles: ["sip-verto", "full"]
    working_dir: /tmp
    command:
      - python3
      - /app/scripts/codex-voice-bridge.py
      - --host
      - 0.0.0.0
      - --port
      - "8771"
    ports:
      - "127.0.0.1:8771:8771"
    volumes:
      - codex-voice-auth:/root/.codex
      - ./config/codex-voice-requirements.toml:/etc/codex/requirements.toml:ro
    environment:
      CODEX_HOME: /root/.codex
      CODEX_VOICE_WORKSPACE: /tmp/acc-codex-voice
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c 'import json, urllib.request; payload = json.load(urllib.request.urlopen("http://127.0.0.1:8771/health", timeout=2)); raise SystemExit(0 if payload.get("ok") else 1)'
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  assert-viewer:
    build:
      context: .
      target: assert-runtime
    image: agentic-contact-center:assert-local
    profiles: ["eval", "full"]
    command:
      - sh
      - -lc
      - node scripts/assert-export.mjs && node scripts/assert-viewer.mjs
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ./artifacts:/app/artifacts
      - ./.assert-viewer:/app/.assert-viewer
    environment:
      ARTIFACTS_ROOT: /app/artifacts/results

volumes:
  codex-voice-auth:
